name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: erp
  POSTGRES_PASSWORD: erp
  POSTGRES_DB: erp

jobs:
  qualidade:
    name: Tipos, lint e código morto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Código morto
        run: npm run lint:dead

  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cobertura (gate 100% na lista escopada)
        run: npm run test:coverage

  banco:
    name: Migrations e isolamento entre tenants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Aplicar migrations
        run: npm run db:migrate
        env:
          DATABASE_ADMIN_URL: postgres://erp:erp@localhost:5432/erp

      - name: Migrations são idempotentes
        run: npm run db:migrate
        env:
          DATABASE_ADMIN_URL: postgres://erp:erp@localhost:5432/erp

      - name: Um tenant não enxerga o outro
        run: |
          set -euo pipefail
          export PGPASSWORD=erp
          A=11111111-1111-1111-1111-111111111111
          B=22222222-2222-2222-2222-222222222222

          psql -h localhost -U erp -d erp -v ON_ERROR_STOP=1 -c \
            "INSERT INTO tenant (id, nome, segmento) VALUES
               ('$A','Padaria CI','padaria'), ('$B','Hortifruti CI','hortifruti');"

          export PGPASSWORD=erp_app

          sem_contexto=$(psql -h localhost -U erp_app -d erp -tA -c "SELECT count(*) FROM tenant;")
          if [ "$sem_contexto" != "0" ]; then
            echo "FALHA: sem contexto de tenant o banco devolveu $sem_contexto linha(s); esperado 0"
            exit 1
          fi

          # -q suprime os rotulos BEGIN/COMMIT; sem ele, tail -1 le "COMMIT"
          ver_como() {
            psql -q -h localhost -U erp_app -d erp -tA -c \
              "BEGIN; SELECT set_config('app.tenant_id','$1',true);
               SELECT coalesce(string_agg(nome, ','), '<vazio>') FROM tenant; COMMIT;" \
              | tail -1
          }

          visto_a=$(ver_como "$A")
          if [ "$visto_a" != "Padaria CI" ]; then
            echo "FALHA: no contexto do tenant A o banco devolveu '$visto_a'; esperado exatamente 'Padaria CI'"
            exit 1
          fi

          visto_b=$(ver_como "$B")
          if [ "$visto_b" != "Hortifruti CI" ]; then
            echo "FALHA: no contexto do tenant B o banco devolveu '$visto_b'; esperado exatamente 'Hortifruti CI'"
            exit 1
          fi

          echo "OK: sem contexto 0 linhas; cada tenant enxerga apenas o proprio dado"

  storybook:
    name: Storybook compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgres://erp_app:erp_app@localhost:5432/erp
      - name: Orçamento de performance
        run: npm run perf
